name: Batch 6 profiling

on:
  push:
    branches:
      - feature/runwire-2.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Codec and lookup profile (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Resolve production dependencies
        run: composer update --no-dev --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Verify profile syntax
        run: php -l benchmarks/batch-6-profile.php
      - name: Run bounded characterization
        run: |
          php benchmarks/batch-6-profile.php 50000 256 | tee batch-6-profile.json
          php -r '$data = json_decode(file_get_contents("batch-6-profile.json"), true, flags: JSON_THROW_ON_ERROR); if (count($data["measurements"]) !== 6 || $data["resolved_class_count"] < 8) { exit(1); }'
      - uses: actions/upload-artifact@v4
        with:
          name: batch-6-profile-php-${{ matrix.php }}
          path: batch-6-profile.json
          retention-days: 14

  sql-plans:
    name: Durable queue index characterization
    if: contains(github.event.head_commit.message, '[db-plan]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: phpforge
          MYSQL_USER: phpforge
          MYSQL_PASSWORD: phpforge_test
          MYSQL_ROOT_PASSWORD: phpforge_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pphpforge_root_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: phpforge
          POSTGRES_USER: phpforge
          POSTGRES_PASSWORD: phpforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phpforge -d phpforge"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      IC_SERVICE_DATABASE: phpforge
      IC_SERVICE_USERNAME: phpforge
      IC_SERVICE_PASSWORD: phpforge_test
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Install benchmark dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Compare index candidates on representative seeded queues
        run: |
          mkdir -p build/batch-6-db
          for driver in mysql pgsql; do
            for candidate in current candidate candidate-reclaim; do
              php benchmarks/db-contention.php "$driver" 2 10000 "$candidate" \
                > "build/batch-6-db/$driver-$candidate.json"
              php -r '$r=json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR); if ($r["acknowledged"]!==10000 || $r["missing_settlements"]!==0 || $r["duplicate_or_stale_settlements"]!==0) exit(1);' \
                "build/batch-6-db/$driver-$candidate.json"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: batch-6-db-plans
          path: build/batch-6-db/*.json
          retention-days: 14

  deep-db:
    name: MySQL and PostgreSQL 100k queue-depth characterization
    if: contains(github.event.head_commit.message, '[db-depth]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: phpforge
          MYSQL_USER: phpforge
          MYSQL_PASSWORD: phpforge_test
          MYSQL_ROOT_PASSWORD: phpforge_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pphpforge_root_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: phpforge
          POSTGRES_USER: phpforge
          POSTGRES_PASSWORD: phpforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U phpforge -d phpforge"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      IC_SERVICE_DATABASE: phpforge
      IC_SERVICE_USERNAME: phpforge
      IC_SERVICE_PASSWORD: phpforge_test
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Resolve test dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Compare current and candidate indexes at 100k backlog
        run: |
          mkdir -p build/deep-db
          for driver in mysql pgsql; do
            for choice in current candidate; do
              php benchmarks/db-contention.php "$driver" 4 100000 "$choice" > "build/deep-db/$driver-$choice.json"
              php -r '$r=json_decode(file_get_contents($argv[1]),true,flags:JSON_THROW_ON_ERROR); if ($r["acknowledged"]!==100000 || $r["missing_settlements"]!==0 || $r["duplicate_or_stale_settlements"]!==0 || $r["consumers"]!==4) { exit(1); }' "build/deep-db/$driver-$choice.json"
              jq '{driver,index_set,consumers,depth,messages_per_second,receive_p50_ms,receive_p95_ms,receive_p99_ms,missing_settlements,duplicate_or_stale_settlements,transaction_stats,execution_plan}' "build/deep-db/$driver-$choice.json"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-8-100k-queue-plans
          path: build/deep-db/*.json
          retention-days: 30

  clone-review:
    name: PHPForge duplicate-group inventory
    if: contains(github.event.head_commit.message, '[clone-review]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Resolve development analyzers
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Capture PHPForge duplicate-group report
        run: |
          composer ic:test:duplicate > batch-6-duplicates.txt 2>&1
          cat batch-6-duplicates.txt
      - uses: actions/upload-artifact@v4
        with:
          name: batch-6-duplicate-groups
          path: batch-6-duplicates.txt
          retention-days: 14


  retention-history:
    name: SQLite 100k and 1m failure history and active claim retention
    if: contains(github.event.head_commit.message, '[retention-million]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Check retention semantics against 100k and 1m historical failures
        run: |
          mkdir -p build/retention
          php benchmarks/failure-retention.php 100000 > build/retention/100k.json
          jq -e '.history_depth==100000 and .pruned_unclaimed==99998 and .retained_retrying_and_sent==2 and .final_failure_rows==0' build/retention/100k.json
          php benchmarks/failure-retention.php 1000000 > build/retention/1m.json
          jq -e '.history_depth==1000000 and .pruned_unclaimed==999998 and .retained_retrying_and_sent==2 and .final_failure_rows==0' build/retention/1m.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-8-100k-1m-failure-retention
          path: build/retention/
          retention-days: 30
