name: Batch 8 release preflight

on:
  push:
    branches:
      - feature/runwire-2.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-validator:
    name: Stable performance validator adversarial self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Verify accepted and rejected performance evidence
        run: php benchmarks/release-acceptance-selftest.php

  engineering-gates:
    name: Exact-head PHPForge release checks and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Resolve dependency lock
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Record exact candidate SHA, resolved locks and execution platform
        run: |
          mkdir -p build/release-evidence
          git rev-parse HEAD > build/release-evidence/candidate-sha.txt
          sha256sum composer.lock > build/release-evidence/composer-lock.sha256
          composer show --locked --format=json > build/release-evidence/composer-lock.json
          php -r 'echo json_encode(["php"=>PHP_VERSION,"sapi"=>PHP_SAPI,"extensions"=>get_loaded_extensions(),"os"=>PHP_OS_FAMILY],JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR),PHP_EOL;' > build/release-evidence/php-platform.json
      - name: Validate manifest and live security advisories
        run: |
          composer validate --strict
          composer audit --locked --no-dev
          composer audit --locked --abandoned=report
          composer check-platform-reqs
      - name: Run installed PHPForge processor
        run: composer ic:process
      - name: Run detailed QA and release acceptance
        run: |
          composer ic:tests:details
          composer ic:release:guard
      - name: Check the tooling did not mutate tracked files
        run: git diff --exit-code -- .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-8-candidate-lock-and-platform
          path: build/release-evidence/
          retention-days: 30
