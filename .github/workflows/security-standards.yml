name: "Security & Standards"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

permissions:
  contents: read

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5"]'
      php_extensions: "memcached, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, redis, pdo_sqlsrv"
      fail_on_skipped_tests: true
      integration_services: '["mysql","mariadb","postgres","mssql","sqlite","redis","valkey","memcached"]'
      service_topologies: '{}'
      service_db_name: "phpforge"
      service_db_user: "phpforge"
      service_password: "Phpforge_123!"
      benchmark_composer_script: "benchmark:release"
      benchmark_result_file: "build/benchmark-result.json"
      benchmark_stable_environment: false

  replica-affinity:
    name: "Replica writer affinity"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PHPFORGE_SERVICE_DATABASE: "phpforge"
      PHPFORGE_SERVICE_USERNAME: "phpforge"
      PHPFORGE_SERVICE_PASSWORD: "Phpforge_123!"
      IC_SERVICE_DATABASE: "phpforge"
      IC_SERVICE_USERNAME: "phpforge"
      IC_SERVICE_PASSWORD: "Phpforge_123!"
      IC_SERVICE_REPLICA_DATABASE: "phpforge_lagging"
      INTEGRATION_SERVICES: '["mysql","mariadb","postgres"]'
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Set up PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: "pdo_mysql, pdo_pgsql"
          coverage: none

      - name: "Install dependencies"
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: "Start database services"
        run: >-
          docker compose
          --file vendor/infocyph/phpforge/resources/services/compose.yml
          --profile mysql
          --profile mariadb
          --profile postgres
          up --detach --wait

      - name: "Create deliberately stale databases"
        run: |
          docker compose --file vendor/infocyph/phpforge/resources/services/compose.yml \
            exec --no-TTY --env MYSQL_PWD="$PHPFORGE_SERVICE_PASSWORD" mysql \
            mysql --user=root \
            --execute="CREATE DATABASE phpforge_lagging; GRANT ALL PRIVILEGES ON phpforge_lagging.* TO 'phpforge'@'%';"
          docker compose --file vendor/infocyph/phpforge/resources/services/compose.yml \
            exec --no-TTY --env MYSQL_PWD="$PHPFORGE_SERVICE_PASSWORD" mariadb \
            mariadb --user=root \
            --execute="CREATE DATABASE phpforge_lagging; GRANT ALL PRIVILEGES ON phpforge_lagging.* TO 'phpforge'@'%';"
          docker compose --file vendor/infocyph/phpforge/resources/services/compose.yml \
            exec --no-TTY postgres psql --username=phpforge --dbname=postgres \
            --command="CREATE DATABASE phpforge_lagging OWNER phpforge;"

      - name: "Verify writer-affine mutations"
        run: >-
          php vendor/bin/pest
          --configuration vendor/infocyph/phpforge/resources/pest.xml
          --bootstrap vendor/autoload.php
          tests/Integration/DurableDriverMatrixTest.php
          --filter "mutation decisions remain writer-affine"

      - name: "Stop database services"
        if: always()
        run: >-
          docker compose
          --file vendor/infocyph/phpforge/resources/services/compose.yml
          --profile mysql
          --profile mariadb
          --profile postgres
          down --volumes

  executable-examples:
    name: Executable examples (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Verify standalone and Runwire host integration
        run: |
          php -l examples/standalone-consumer.php
          php -l examples/runwire-forwarding.php
          php examples/standalone-consumer.php
          php examples/runwire-forwarding.php

  packed-consumer:
    name: Production archive, optional integrations and real PHP-FPM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Build distribution archive and independent project
        run: |
          composer archive --format=zip --file=omnibus-3-preflight --dir="$RUNNER_TEMP"
          archive="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'omnibus-3-preflight*.zip' -print -quit)"
          test -n "$archive"
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/package" "$RUNNER_TEMP/consumer"
          unzip -q "$archive" -d "$RUNNER_TEMP/unpacked"
          manifest="$(find "$RUNNER_TEMP/unpacked" -name composer.json -print -quit)"
          test -n "$manifest"
          cp -a "$(dirname "$manifest")"/. "$RUNNER_TEMP/package/"
          test -f "$RUNNER_TEMP/package/src/MessageBus.php"
          for forbidden in tests docs benchmarks examples .github vendor composer.lock; do
            test ! -e "$RUNNER_TEMP/package/$forbidden"
          done
          cat > "$RUNNER_TEMP/consumer/composer.json" <<'JSON'
          {
            "name": "omnibus/isolated-consumer",
            "license": "proprietary",
            "require": {"infocyph/omnibus": "^3.0@dev"},
            "repositories": [{"type": "path", "url": "../package",
              "options": {"symlink": false, "versions": {"infocyph/omnibus": "3.0.0-dev"}}}],
            "minimum-stability": "stable"
          }
          JSON
          cd "$RUNNER_TEMP/consumer"
          composer validate --strict --no-check-publish
          composer update --no-dev --no-interaction --prefer-dist --no-progress --prefer-stable
          composer dump-autoload --optimize --no-dev
          composer check-platform-reqs
          test -f vendor/infocyph/omnibus/src/MessageBus.php
          test ! -e vendor/infocyph/omnibus/tests
          test ! -e vendor/infocyph/omnibus/docs
      - name: Run standalone example against independent production autoloader
        run: php examples/standalone-consumer.php "$RUNNER_TEMP/consumer/vendor/autoload.php"
      - name: Verify actual FastCGI request in PHP-FPM
        run: |
          cp examples/fpm-request.php "$RUNNER_TEMP/consumer/fpm-request.php"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfcgi-bin
          docker run --rm -d --name omnibus-consumer-fpm -p 127.0.0.1:9090:9000 \
            -v "$RUNNER_TEMP/consumer:/app:ro" -w /app php:8.4-fpm-alpine
          success=0
          for attempt in $(seq 1 30); do
            response="$(SCRIPT_FILENAME=/app/fpm-request.php SCRIPT_NAME=/fpm-request.php \
              REQUEST_METHOD=GET REQUEST_URI=/fpm-request.php SERVER_PROTOCOL=HTTP/1.1 \
              DOCUMENT_ROOT=/app cgi-fcgi -bind -connect 127.0.0.1:9090 2>&1)" || {
                sleep 1
                continue
              }
            if grep -Fq '"ok":true' <<< "$response" && grep -Fq '"value":42' <<< "$response"; then
              success=1
              break
            fi
            sleep 1
          done
          printf '%s\n' "$response"
          docker logs omnibus-consumer-fpm
          test "$success" -eq 1
      - name: Install selected optional adapters without dev packages
        run: |
          cd "$RUNNER_TEMP/consumer"
          composer require --update-no-dev --no-interaction --prefer-dist --no-progress \
            "infocyph/dblayer:^6.0" "infocyph/cachelayer:^4.0" "infocyph/runwire:2.1.1"
          composer check-platform-reqs
          php "$GITHUB_WORKSPACE/examples/runwire-forwarding.php" "$RUNNER_TEMP/consumer/vendor/autoload.php"
      - name: Close PHP-FPM container
        if: always()
        run: docker rm -f omnibus-consumer-fpm >/dev/null 2>&1 || true

  strict-sphinx:
    name: Strict Sphinx and cross references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build strict HTML documentation
        run: python -m sphinx -n -W -b html docs build/sphinx
