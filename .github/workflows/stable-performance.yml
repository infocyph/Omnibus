name: Hosted matched release performance acceptance

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, master, develop, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnibus-hosted-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: '3.0.2'
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: '3.0.2'
          path: dependency-only
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Verify accepted and rejected performance evidence
        run: php candidate/benchmarks/release-acceptance-selftest.php
      - name: Match harness and dependency-only baseline
        run: |
          for target in baseline dependency-only; do
            cp candidate/benchmarks/release.php "$target/benchmarks/release.php"
            cp candidate/benchmarks/release-host.php "$target/benchmarks/release-host.php"
            cp candidate/benchmarks/host-process-monitor.php "$target/benchmarks/host-process-monitor.php"
          done
          php -r '
            $p="dependency-only/composer.json";
            $c=json_decode(file_get_contents($p),true,flags:JSON_THROW_ON_ERROR);
            $c["require"]["infocyph/uid"]="^6.0.1";
            $c["require-dev"]["infocyph/cachelayer"]="^4.0.2";
            $c["require-dev"]["infocyph/dblayer"]="^6.1.4";
            $c["require-dev"]["infocyph/runwire"]="^3.0";
            file_put_contents($p,json_encode($c,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR));
          '
      - name: Lock all variants and capture hashes
        run: |
          mkdir -p results
          for target in baseline dependency-only candidate; do
            (cd "$target" && composer update --no-interaction --prefer-dist --no-progress --prefer-stable && composer check-platform-reqs)
            sha256sum "$target/composer.lock" > "results/$target-lock.sha256"
          done
          git -C candidate rev-parse HEAD > results/candidate-revision.txt
      - name: Seven long-window alternating matched trials on one hosted runner
        env:
          OMNIBUS_BENCHMARK_STABLE: '0'
          OMNIBUS_BENCHMARK_HTTP_WORKERS: '4'
          # 10k requests/client: warm c4 lasts several seconds instead of ~0.5s.
          OMNIBUS_BENCHMARK_REQUESTS_PER_CLIENT: '10000'
        run: |
          for trial in 1 2 3 4 5 6 7; do
            if [ "$((trial % 2))" -eq 0 ]; then
              variants="candidate-bound candidate-host-only candidate-unbound dependency-only baseline"
            else
              variants="baseline dependency-only candidate-unbound candidate-host-only candidate-bound"
            fi
            for variant in $variants; do
              case "$variant" in
                baseline) dir=baseline; flags=OMNIBUS_BENCHMARK_BOUND=0 ;;
                dependency-only) dir=dependency-only; flags=OMNIBUS_BENCHMARK_BOUND=0 ;;
                candidate-unbound) dir=candidate; flags=OMNIBUS_BENCHMARK_BOUND=0 ;;
                candidate-host-only) dir=candidate; flags=OMNIBUS_BENCHMARK_HOST_ONLY=1 ;;
                candidate-bound) dir=candidate; flags=OMNIBUS_BENCHMARK_BOUND=1 ;;
              esac
              (cd "$dir" && env "$flags" OMNIBUS_BENCHMARK_RELEASE="$variant" OMNIBUS_BENCHMARK_REVISION="$(git rev-parse HEAD)" \
                php benchmarks/release.php "../results/$variant-$trial.json" > /dev/null)
            done
          done
      - name: Enforce scoped hosted matched-release budgets
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          php candidate/benchmarks/release-acceptance.php results hosted | tee results/acceptance.json
          jq -e --rawfile sha results/candidate-revision.txt '.passed == true and .certification_scope == "github-hosted-matched" and .environment_stable == false and .runner_environment == "github-hosted" and .candidate_revision == ($sha | rtrimstr("\n"))' results/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnibus-stable-performance-results
          path: results/
          retention-days: 90
