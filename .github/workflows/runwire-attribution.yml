name: Runwire component attribution

on:
  push:
    branches:
      - feature/runwire-2.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    if: contains(github.event.head_commit.message, '[runwire-attribution]')
    name: Isolate Runwire overhead (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install candidate integration stack
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Run rotating component attribution trials
        run: php benchmarks/runwire-attribution.php 20000 runwire-attribution-${{ matrix.php }}.json
      - name: Verify report and print medians
        run: |
          jq -e '.stable == false and .host_runtime_reused == true and (.trials | length) == 15' runwire-attribution-${{ matrix.php }}.json > /dev/null
          for case in direct request-only host-only bound-noop bound-dispatch; do
            jq -s -r --arg scenario "$case" '.[0].trials | map(select(.scenario == $scenario) | .successful_ops_per_second) | sort | .[1]' \
              runwire-attribution-${{ matrix.php }}.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: runwire-attribution-php${{ matrix.php }}
          path: runwire-attribution-${{ matrix.php }}.json
          retention-days: 30

  binding-a-b:
    if: contains(github.event.head_commit.message, '[binding-ab]')
    name: Same-dependency baseline and optimized binding (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Save exact old and new source against same Composer deps
        run: |
          git show HEAD^:src/Integration/Runwire/RunwireBinding.php > "$RUNNER_TEMP/binding-original.php"
          cp src/Integration/Runwire/RunwireBinding.php "$RUNNER_TEMP/binding-candidate.php"
      - name: Alternate two implementations on same runner
        run: |
          mkdir -p binding-a-b
          for trial in 1 2 3; do
            if [ "$trial" -eq 2 ]; then
              variants="candidate original"
            else
              variants="original candidate"
            fi
            for variant in $variants; do
              cp "$RUNNER_TEMP/binding-$variant.php" src/Integration/Runwire/RunwireBinding.php
              php benchmarks/runwire-attribution.php 12000 "binding-a-b/$variant-$trial.json"
            done
          done
          cp "$RUNNER_TEMP/binding-candidate.php" src/Integration/Runwire/RunwireBinding.php
      - name: Compare paired medians without certifying release RPM
        run: |
          for variant in original candidate; do
            jq -s -r '[.[] | .trials[] | select(.scenario == "bound-dispatch") | .successful_ops_per_second] | sort | .[4]' \
              binding-a-b/$variant-1.json binding-a-b/$variant-2.json binding-a-b/$variant-3.json
          done
          echo "A/B values are for isolated bound dispatch, not end-to-end stable host RPM."
      - uses: actions/upload-artifact@v4
        with:
          name: binding-fastpath-ab-php${{ matrix.php }}
          path: binding-a-b/*.json
          retention-days: 30
