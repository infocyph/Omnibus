name: Consolidate Omnibus Runwire Plan

on:
  push:
    branches:
      - docs/omnibus-2.6-foundation-hardening-plan

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/omnibus-2.6-foundation-hardening-plan
      - name: Consolidate plan files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          main = Path('docs/plans/omnibus-2.6-foundation-integration-hardening-plan.md')
          addendum = Path('docs/plans/omnibus-2.6-runwire-supervision-alignment-addendum.md')
          text = main.read_text()
          extra = addendum.read_text()

          parts = extra.split('\n---\n', 1)
          body = (parts[1] if len(parts) == 2 else extra).strip()
          text = text.replace('future ProcessGuard', 'Runwire 1.0')
          text = text.replace('ProcessGuard extraction', 'Runwire delegation')
          text = text.replace('ProcessGuard', 'Runwire')
          text = text.rstrip() + '\n\n---\n\n# Runwire 1.0 process-supervision integration\n\n' + body + '\n'
          text = text.replace('This addendum', 'This section').replace('the addendum', 'this section')
          text = text.replace('addendum supersedes', 'section supersedes')
          main.write_text(text)
          addendum.unlink()
          Path('.github/workflows/consolidate-runwire-plan.yml').unlink()
          PY
      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: consolidate Omnibus 2.6 Runwire plan"
          git push origin HEAD:docs/omnibus-2.6-foundation-hardening-plan
