name: Batch 6 matched-version comparisons

on:
  push:
    branches:
      - feature/runwire-2.1

permissions:
  contents: read

jobs:
  comparison:
    if: contains(github.event.head_commit.message, '[compare-version]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: '2.6'
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: '2.6'
          path: dependency-only
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Use identical release workload harnesses
        run: |
          for target in baseline dependency-only; do
            cp candidate/benchmarks/release.php "$target/benchmarks/release.php"
            cp candidate/benchmarks/release-host.php "$target/benchmarks/release-host.php"
            cp candidate/benchmarks/host-process-monitor.php "$target/benchmarks/host-process-monitor.php"
          done
      - name: Adopt only the 3.0 dependency floor in the second 2.6 checkout
        run: |
          php -r '
            $path="dependency-only/composer.json";
            $config=json_decode(file_get_contents($path),true,flags:JSON_THROW_ON_ERROR);
            $config["require"]["infocyph/uid"]="^6.0";
            $config["require-dev"]["infocyph/cachelayer"]="^4.0";
            $config["require-dev"]["infocyph/dblayer"]="^6.0";
            $config["require-dev"]["infocyph/runwire"]="2.1.1";
            file_put_contents($path,json_encode($config,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR));
          '
      - name: Resolve each variant with isolated Composer dependencies
        run: |
          for target in baseline dependency-only candidate; do
            (cd "$target" && composer update --no-interaction --prefer-dist --no-progress --prefer-stable)
            (cd "$target" && composer check-platform-reqs)
          done
      - name: Run alternating matched workload trials
        run: |
          mkdir -p results
          for trial in 1 2 3; do
            (cd baseline && OMNIBUS_BENCHMARK_RELEASE=2.6 OMNIBUS_BENCHMARK_REVISION="$(git rev-parse HEAD)" OMNIBUS_BENCHMARK_BOUND=0 php benchmarks/release.php "../results/2.6-$trial.json" > /dev/null)
            (cd candidate && OMNIBUS_BENCHMARK_RELEASE=3.0-unbound OMNIBUS_BENCHMARK_REVISION="$(git rev-parse HEAD)" OMNIBUS_BENCHMARK_BOUND=0 php benchmarks/release.php "../results/3.0-unbound-$trial.json" > /dev/null)
            (cd dependency-only && OMNIBUS_BENCHMARK_RELEASE=2.6-dependency-only OMNIBUS_BENCHMARK_REVISION="$(git rev-parse HEAD)" OMNIBUS_BENCHMARK_BOUND=0 php benchmarks/release.php "../results/dependency-only-$trial.json" > /dev/null)
            (cd candidate && OMNIBUS_BENCHMARK_RELEASE=3.0-host-only OMNIBUS_BENCHMARK_REVISION="$(git rev-parse HEAD)" OMNIBUS_BENCHMARK_HOST_ONLY=1 php benchmarks/release.php "../results/3.0-host-only-$trial.json" > /dev/null)
            (cd candidate && OMNIBUS_BENCHMARK_RELEASE=3.0-bound OMNIBUS_BENCHMARK_REVISION="$(git rev-parse HEAD)" OMNIBUS_BENCHMARK_BOUND=1 php benchmarks/release.php "../results/3.0-bound-$trial.json" > /dev/null)
          done
      - name: Verify correctness and report diagnostic median RPM
        run: |
          for variant in 2.6 dependency-only 3.0-unbound 3.0-host-only 3.0-bound; do
            for trial in 1 2 3; do
              jq -e 'all(.workloads[]; .result.failed_operations == 0 and .result.timeouts == 0)' \
                "results/$variant-$trial.json" > /dev/null
            done
            echo "$variant"
            jq -s -r '[.[] | .workloads[] | select(.name=="request_host_warm_c4") | .result.successful_rpm] | sort | .[1]' \
              "results/$variant-1.json" "results/$variant-2.json" "results/$variant-3.json"
          done
          echo "Hosted-runner comparison is diagnostic, NOT the stable performance release gate."
      - uses: actions/upload-artifact@v4
        with:
          name: batch-6-matched-version-trials
          path: results/*.json
          retention-days: 14

  actual-host-workers:
    if: contains(github.event.head_commit.message, '[host-compare]')
    name: Four real PHP host workers, matched GitHub-runner diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: actions/checkout@v7
        with:
          ref: '2.6'
          path: baseline
      - uses: actions/checkout@v7
        with:
          ref: '2.6'
          path: dependency-only
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Share same benchmark harness across released baseline and candidate
        run: |
          for target in baseline dependency-only; do
            cp candidate/benchmarks/release.php "$target/benchmarks/release.php"
            cp candidate/benchmarks/release-host.php "$target/benchmarks/release-host.php"
            cp candidate/benchmarks/host-process-monitor.php "$target/benchmarks/host-process-monitor.php"
          done
          php -r '
            $p="dependency-only/composer.json";
            $c=json_decode(file_get_contents($p),true,flags:JSON_THROW_ON_ERROR);
            $c["require"]["infocyph/uid"]="^6.0";
            $c["require-dev"]["infocyph/cachelayer"]="^4.0";
            $c["require-dev"]["infocyph/dblayer"]="^6.0";
            $c["require-dev"]["infocyph/runwire"]="2.1.1";
            file_put_contents($p,json_encode($c,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_THROW_ON_ERROR));
          '
      - name: Resolve isolated Composer dependencies and verify platform
        run: |
          for target in baseline dependency-only candidate; do
            (cd "$target" && composer update --no-interaction --prefer-dist --no-progress --prefer-stable && composer check-platform-reqs)
          done
      - name: Execute real 4-worker host comparisons with balanced trial order
        env:
          OMNIBUS_BENCHMARK_HTTP_WORKERS: '4'
          OMNIBUS_BENCHMARK_REQUESTS_PER_CLIENT: '1000'
        run: |
          mkdir -p results
          for trial in 1 2 3; do
            if [ "$trial" -eq 2 ]; then
              variants="3.0-bound 3.0-host-only 3.0-unbound dependency-only 2.6"
            else
              variants="2.6 dependency-only 3.0-unbound 3.0-host-only 3.0-bound"
            fi
            for variant in $variants; do
              case "$variant" in
                2.6) dir=baseline; flags="OMNIBUS_BENCHMARK_BOUND=0" ;;
                dependency-only) dir=dependency-only; flags="OMNIBUS_BENCHMARK_BOUND=0" ;;
                3.0-unbound) dir=candidate; flags="OMNIBUS_BENCHMARK_BOUND=0" ;;
                3.0-host-only) dir=candidate; flags="OMNIBUS_BENCHMARK_HOST_ONLY=1" ;;
                3.0-bound) dir=candidate; flags="OMNIBUS_BENCHMARK_BOUND=1" ;;
              esac
              (cd "$dir" && env "$flags" OMNIBUS_BENCHMARK_RELEASE="$variant" OMNIBUS_BENCHMARK_REVISION="$(git rev-parse HEAD)" \
                php benchmarks/release.php "../results/$variant-$trial.json" >/dev/null)
              jq -e '.environment.http_server_workers==4 and .environment.stable==false and all(.workloads[]; .result.failed_operations==0 and .result.timeouts==0) and all(.workloads[] | select(.name=="request_host_warm_c4"); .result.memory.peak_mb > 0 and .result.cpu.seconds_per_successful_operation > 0 and .metadata.host_processes_peak >= 4)' \
                "results/$variant-$trial.json" > /dev/null
            done
          done
      - name: Publish diagnostic throughput and tail latencies
        run: |
          for variant in 2.6 dependency-only 3.0-unbound 3.0-host-only 3.0-bound; do
            jq -s -r --arg variant "$variant" '{variant:$variant, median_correct_rpm:([.[] | .workloads[] | select(.name=="request_host_warm_c4") | .result.successful_rpm] | sort | .[1]), p95_ms:([.[] | .workloads[] | select(.name=="request_host_warm_c4") | .result.latency_ms.p95] | sort | .[1]), p99_ms:([.[] | .workloads[] | select(.name=="request_host_warm_c4") | .result.latency_ms.p99] | sort | .[1])}' \
              "results/$variant-1.json" "results/$variant-2.json" "results/$variant-3.json"
          done
          echo "GH hosted environment.stable=false. Do not certify final 2% RPM acceptance from this job."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-8-four-php-workers
          path: results/*.json
          retention-days: 30

