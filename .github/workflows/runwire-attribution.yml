name: Runwire component attribution

on:
  push:
    branches:
      - feature/runwire-2.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution:
    if: contains(github.event.head_commit.message, '[runwire-attribution]')
    name: Isolate Runwire overhead (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install candidate integration stack
        run: composer update --no-interaction --prefer-dist --no-progress --prefer-stable
      - name: Run rotating component attribution trials
        run: php benchmarks/runwire-attribution.php 20000 runwire-attribution-${{ matrix.php }}.json
      - name: Verify report and print medians
        run: |
          jq -e '.stable == false and .host_runtime_reused == true and (.trials | length) == 15' runwire-attribution-${{ matrix.php }}.json > /dev/null
          for case in direct request-only host-only bound-noop bound-dispatch; do
            jq -s -r --arg scenario "$case" '.[0].trials | map(select(.scenario == $scenario) | .successful_ops_per_second) | sort | .[1]' \
              runwire-attribution-${{ matrix.php }}.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: runwire-attribution-php${{ matrix.php }}
          path: runwire-attribution-${{ matrix.php }}.json
          retention-days: 30
